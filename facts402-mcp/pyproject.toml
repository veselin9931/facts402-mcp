[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "facts402-mcp"
version = "0.1.0"
description = "MCP server: pay-per-call fact checks for AI agents (IBAN, EU VAT, OFAC sanctions, LEI, phone, email, FX, WHOIS) via x402 USDC on Base. Also the shared core of base-memecoin-guard-mcp."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "facts402" }]
keywords = [
    "mcp", "model-context-protocol", "x402", "usdc", "base", "iban", "bic", "vat", "vies", "sanctions", "ofac",
    "aml", "kyc", "kyb", "lei", "gleif", "fx", "phone-validation", "email-validation", "whois",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=2.3,<3",
    "x402[evm]==2.26.0",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "anyio>=4.5,<5",
    "eth-account>=0.13,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
facts402-mcp = "facts402_mcp.server:main"

[project.urls]
Homepage = "https://api.facts402.com"
Repository = "https://github.com/veselin9931/facts402-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/facts402_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real services (free routes, or the zero-funds payment path); run with -m live"]
addopts = "-m 'not live'"
